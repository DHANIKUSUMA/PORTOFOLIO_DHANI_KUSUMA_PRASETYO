  <circle cx="410" cy="170" r="36" fill="#EAEDFF"/>
  <!-- Key icon mockup -->
  <path d="M400,165 C400,158 406,152 414,152 C422,152 428,158 428,165 C428,171 423,176 417,177 L417,192 L412,192 L412,185 L408,185 L408,177 C403,176 400,171 400,165 Z" fill="#5267FF"/>

  <rect x="345" y="230" width="130" height="32" rx="6" fill="#C9FF57"/>
  <text x="410" y="250" fill="#10162B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Scan QR Rak Kunci</text>

  <rect x="345" y="275" width="130" height="32" rx="6" fill="#5267FF"/>
  <text x="410" y="295" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Verifikasi Sukses</text>

