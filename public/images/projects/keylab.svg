  <circle cx="550" cy="160" r="10" fill="#5267FF"/>
  <text x="550" y="164" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">1</text>
  <text x="570" y="164" fill="#EAEDFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Cek Ketersediaan Lab</text>

  <circle cx="550" cy="205" r="10" fill="#5267FF"/>
  <text x="550" y="209" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">2</text>
  <text x="570" y="209" fill="#EAEDFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Pengajuan Pinjam Kunci</text>

