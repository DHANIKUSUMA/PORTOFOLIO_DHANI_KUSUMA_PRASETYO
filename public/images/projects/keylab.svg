      <stop offset="0%" stop-color="#10162B"/>
      <stop offset="100%" stop-color="#182142"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#keylabBg)" rx="16"/>

  <g opacity="0.08" stroke="#EAEDFF" stroke-width="1">
