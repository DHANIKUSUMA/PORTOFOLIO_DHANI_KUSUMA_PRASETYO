  <text x="165" y="230" fill="#FF5F56" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Dipinjam • Praktikum RPL</text>

  <!-- Mobile Screen 2 (Key Handover Flow) -->
  <rect x="330" y="65" width="160" height="340" rx="20" fill="#FFFFFF" stroke="#5267FF" stroke-width="3"/>
