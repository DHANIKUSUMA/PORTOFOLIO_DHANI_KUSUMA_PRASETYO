<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="printBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10162B"/>
      <stop offset="100%" stop-color="#161E38"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#printBg)" rx="16"/>

  <g opacity="0.08" stroke="#EAEDFF" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- POS Frame -->
  <rect x="70" y="50" width="660" height="380" rx="14" fill="#18203E" stroke="#2B3663" stroke-width="2"/>
  <rect x="70" y="50" width="660" height="46" rx="14" fill="#12182F"/>
  <circle cx="102" cy="73" r="6" fill="#FF5F56"/>
  <circle cx="122" cy="73" r="6" fill="#FFBD2E"/>
  <circle cx="122" cy="73" r="6" fill="#27C93F"/>
  
  <text x="160" y="77" fill="#EAEDFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">PrintLab — Lab Printing &amp; POS Module</text>

  <!-- Left: Order Calculator -->
  <rect x="95" y="115" width="370" height="290" rx="10" fill="#1C2448" stroke="#2A3766" stroke-width="1"/>
  <text x="120" y="145" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">Form Pemesanan Berkas Cetak</text>
  
  <rect x="120" y="165" width="320" height="40" rx="6" fill="#222D56"/>
  <text x="135" y="190" fill="#C9FF57" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">✓ Supabase File: Laporan_Akhir_Sistem.pdf</text>

  <!-- Pricing options -->
  <rect x="120" y="215" width="150" height="44" rx="6" fill="#5267FF"/>
  <text x="195" y="242" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Warna (Rp 1.000)</text>

  <rect x="290" y="215" width="150" height="44" rx="6" fill="#222D56" stroke="#3D4B80" stroke-width="1"/>
  <text x="365" y="242" fill="#8E9CBF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle">Hitam Putih (Rp 500)</text>

  <!-- Total Summary -->
  <rect x="120" y="275" width="320" height="54" rx="8" fill="#131A33" stroke="#5267FF" stroke-width="1"/>
  <text x="140" y="297" fill="#8E9CBF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Estimasi Total (42 Halaman A4)</text>
  <text x="140" y="320" fill="#C9FF57" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Rp 42.000</text>

  <rect x="120" y="345" width="320" height="42" rx="8" fill="#5267FF"/>
  <text x="280" y="371" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Proses &amp; Simpan Transaksi</text>

  <!-- Right: Reports Export -->
  <rect x="485" y="115" width="220" height="290" rx="10" fill="#1C2448" stroke="#2A3766" stroke-width="1"/>
  <text x="505" y="145" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Ekspor Laporan</text>
  
  <rect x="505" y="165" width="180" height="60" rx="8" fill="#222D56"/>
  <text x="520" y="190" fill="#EAEDFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Laporan Kasir Bulanan</text>
  <text x="520" y="210" fill="#C9FF57" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">PDF &amp; Spreadsheet Excel</text>

  <rect x="505" y="240" width="180" height="36" rx="6" fill="#C9FF57"/>
  <text x="595" y="263" fill="#10162B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Unduh PDF Rekap</text>

  <rect x="505" y="285" width="180" height="36" rx="6" fill="#24305E" stroke="#5267FF" stroke-width="1"/>
  <text x="595" y="308" fill="#EAEDFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Ekspor Excel (.xlsx)</text>
