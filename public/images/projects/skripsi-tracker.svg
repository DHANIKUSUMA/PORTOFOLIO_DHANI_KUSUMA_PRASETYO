<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="skripsiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10162B"/>
      <stop offset="100%" stop-color="#171F3B"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5267FF"/>
      <stop offset="100%" stop-color="#3F52E3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#skripsiBg)" rx="16"/>

  <!-- Subtle Grid lines -->
  <g opacity="0.08" stroke="#EAEDFF" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Window Mockup -->
  <rect x="70" y="50" width="660" height="380" rx="14" fill="#18203E" stroke="#2B3663" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="70" y="50" width="660" height="46" rx="14" fill="#12182F"/>
  <circle cx="102" cy="73" r="6" fill="#FF5F56"/>
  <circle cx="122" cy="73" r="6" fill="#FFBD2E"/>
  <circle cx="142" cy="73" r="6" fill="#27C93F"/>
  
  <rect x="250" y="64" width="300" height="18" rx="6" fill="#1F284C"/>
  <text x="400" y="77" fill="#8E9CBF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">thesis-progress-tracker.academic/dashboard</text>

  <!-- Sidebar -->
  <rect x="70" y="96" width="150" height="334" fill="#151C36"/>
  <rect x="90" y="120" width="110" height="28" rx="6" fill="url(#indigoGrad)"/>
  <text x="145" y="138" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">5 Roles Panel</text>
  
  <rect x="90" y="165" width="110" height="18" rx="4" fill="#202A4E"/>
  <rect x="90" y="195" width="110" height="18" rx="4" fill="#202A4E"/>
  <rect x="90" y="225" width="110" height="18" rx="4" fill="#202A4E"/>
  <rect x="90" y="255" width="110" height="18" rx="4" fill="#202A4E"/>

  <!-- Content Dashboard -->
  <!-- Stats 1 -->
  <rect x="240" y="120" width="140" height="74" rx="10" fill="#1E274A" stroke="#2D3A6A" stroke-width="1"/>
  <text x="256" y="142" fill="#8E9CBF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Total Mahasiswa</text>
  <text x="256" y="172" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700">128</text>

  <!-- Stats 2 -->
  <rect x="395" y="120" width="140" height="74" rx="10" fill="#1E274A" stroke="#2D3A6A" stroke-width="1"/>
  <text x="411" y="142" fill="#8E9CBF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Aktif Bimbingan</text>
  <text x="411" y="172" fill="#C9FF57" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700">104</text>

  <!-- Stats 3 -->
  <rect x="550" y="120" width="156" height="74" rx="10" fill="#1E274A" stroke="#2D3A6A" stroke-width="1"/>
  <text x="566" y="142" fill="#8E9CBF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Status Peringatan</text>
  <text x="566" y="172" fill="#FF7070" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700">24 Inaktif</text>

  <!-- Table / Timeline Flow -->
  <rect x="240" y="215" width="466" height="190" rx="10" fill="#1B2344" stroke="#2B3663" stroke-width="1"/>
  <text x="260" y="244" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Alur Bimbingan &amp; Validasi Yudisium</text>

  <!-- Progress Stages -->
  <rect x="260" y="265" width="426" height="28" rx="6" fill="#222C54"/>
  <rect x="260" y="265" width="310" height="28" rx="6" fill="#5267FF" opacity="0.25"/>
  <circle cx="280" cy="279" r="6" fill="#C9FF57"/>
  <text x="296" y="283" fill="#EAEDFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Pengajuan Judul • Sempro • Pembimbing 1 &amp; 2 Disetujui</text>

  <rect x="260" y="305" width="426" height="28" rx="6" fill="#222C54"/>
  <circle cx="280" cy="319" r="6" fill="#5267FF"/>
  <text x="296" y="323" fill="#EAEDFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Bimbingan Berkala (12 Sesi Revisi Selesai)</text>

  <rect x="260" y="345" width="426" height="28" rx="6" fill="#222C54"/>
  <circle cx="280" cy="359" r="6" fill="#C9FF57"/>
  <text x="296" y="363" fill="#EAEDFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Validasi Berkas Bebas Masalah &amp; Approval Kaprodi</text>

  <!-- Badge in corner -->
  <rect x="580" y="70" width="126" height="22" rx="4" fill="#C9FF57"/>
  <text x="643" y="85" fill="#10162B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">AGILE SCRUM • 5 ROLES</text>
</svg>
